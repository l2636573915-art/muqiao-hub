<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>时间碎片记录表单（随手记）</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="frame">
      <div class="brand-bar">
        <img class="brand-logo" src="logo.svg" alt="logo" />
      </div>
      <h1>时间碎片记录表单（随手记）</h1>

      <form id="workForm" novalidate>
        <div class="paired-fields">
          <div class="field">
            <label for="departmentRole"><span class="required">*</span>部门岗位</label>
            <input id="departmentRole" name="departmentRole" placeholder="示例：客服1组" required />
          </div>

          <div class="field">
            <label for="personName"><span class="required">*</span>姓名</label>
            <input id="personName" name="personName" placeholder="示例：刘小娇" required />
          </div>
        </div>

        <div class="field">
          <label for="activity"><span class="required">*</span>我在做什么</label>
          <p class="help">可直接在下方预置任务中选择；没有合适的任务时，直接在输入框中填写</p>
          <input id="activity" name="activity" placeholder="请选择下方预置任务或直接填写" required />

          <section class="preset-inline" aria-label="预置任务列表">
            <div class="preset-search">
              <input id="presetSearch" type="search" placeholder="搜索任务编码、业务域、业务对象、任务或说明" />
            </div>
            <div class="category-tabs" id="categoryTabs" aria-label="预置分类"></div>
            <div class="preset-table-head" aria-hidden="true">
              <span>任务编码</span>
              <span>业务域</span>
              <span>业务对象</span>
              <span>预置任务名称</span>
              <span>一句话说明</span>
            </div>
            <div class="preset-list" id="presetList"></div>
          </section>
        </div>

        <div class="field process-field" id="processField" hidden>
          <label for="process"><span class="required">*</span>我怎么做</label>
          <p class="help">可以直接填写，也可以上传录音或现场录音；后续接入 AI 后，会自动转写并整理成清晰的操作步骤</p>

          <div class="voice-panel">
            <div class="voice-actions">
              <button class="voice-btn" id="uploadAudioBtn" type="button">
                <span class="voice-icon" aria-hidden="true">↑</span>
                上传录音
              </button>
              <button class="voice-btn" id="recordAudioBtn" type="button">
                <span class="voice-icon" aria-hidden="true">●</span>
                <span id="recordBtnText">开始录音</span>
              </button>
              <span class="voice-ai-tag">AI 转写待接入</span>
            </div>

            <input
              id="audioFileInput"
              type="file"
              accept="audio/*,.mp3,.m4a,.wav,.webm,.ogg,.aac"
              hidden
            />

            <div class="voice-status" id="voiceStatus" role="status" aria-live="polite">
              录音或音频上传后，将在这里显示处理状态
            </div>

            <div class="audio-preview-wrap" id="audioPreviewWrap" hidden>
              <audio id="audioPreview" controls preload="metadata"></audio>
              <button class="voice-remove" id="removeAudioBtn" type="button">移除录音</button>
            </div>
          </div>

          <textarea
            id="process"
            name="process"
            placeholder="AI 整理结果会自动写入这里；也可以直接手动填写。示例：打开系统查询订单 → 核对客户信息 → 检查物流状态 → 处理异常 → 回复客户"
            required
          ></textarea>
        </div>

        <div class="actions">
          <button class="secondary-action" id="addRecordBtn" type="button">添加记录</button>
          <button type="submit">全部完成并导出 Excel</button>
        </div>

        <div class="error" id="error"></div>
        <div class="message" id="message">已提交，表单信息已记录在当前页面。</div>
        <section class="history" id="submittedHistory" hidden>
          <button class="history-toggle" id="historyToggle" type="button" aria-expanded="false">
            <span>查看记录详情</span>
            <span class="history-count" id="historyCount">0 条</span>
          </button>
          <div class="history-body" id="historyBody" hidden>
            <table class="history-table" id="historyTable"></table>
          </div>
        </section>
      </form>
    </main>
<script src="presets.js"></script>
    <script src="app.js"></script>
  </body>
</html>
